# GitHub Pages 자동 배포
# 이 브랜치에 push될 때마다 빌드 결과(dist/)를 gh-pages 브랜치로 발행한다.
# gh-pages 브랜치가 생기면 GitHub이 Pages 사이트를 자동 활성화한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/new-session-93t4eg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
